<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden – Server-Dashboard</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">
  <main class="login-card" aria-labelledby="loginTitle">
    <div class="login-brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1 id="loginTitle">Server-Dashboard</h1>
        <p class="muted">Minecraft-Server einfach hosten</p>
      </div>
    </div>

    <div class="login-tabs" id="loginTabs" role="tablist">
      <button type="button" role="tab" id="tabLogin" aria-selected="true">Anmelden</button>
      <button type="button" role="tab" id="tabRegister" aria-selected="false">Konto erstellen</button>
    </div>

    <div id="loginMsg" class="login-msg" role="alert" hidden></div>

    <a id="googleBtn" class="btn google-btn" href="/auth/google" hidden>
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      <span>Mit Google anmelden</span>
    </a>
    <div id="orLine" class="or-line" hidden><span>oder mit E-Mail</span></div>

    <form id="authForm" novalidate>
      <label id="nameRow" hidden>Name (optional)
        <input id="fName" type="text" autocomplete="name" maxlength="60">
      </label>
      <label id="emailRow">E-Mail-Adresse
        <input id="fEmail" type="email" autocomplete="email" required>
      </label>
      <label>Passwort
        <input id="fPass" type="password" autocomplete="current-password" required>
      </label>
      <p id="passHint" class="muted small" hidden>Mindestens 10 Zeichen. Nimm etwas, das man nicht erraten kann.</p>
      <button id="submitBtn" class="btn primary wide" type="submit">Anmelden</button>
    </form>

    <p id="closedNote" class="muted small" hidden>Neue Konten können gerade nicht erstellt werden.</p>
    <p class="muted small login-foot" id="loginFoot">Deine Server gehören nur dir. Andere Benutzer können sie weder sehen noch ändern.</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
